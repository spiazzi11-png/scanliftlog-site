<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ScanLiftLog — Sign Up</title>
</head>
<body style="font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial; margin:0; padding:0; background:#fff; color:#111;">
  <div style="max-width:760px; margin:0 auto; padding:40px 20px;">
    <h1 style="margin:0 0 10px;">Gym Signup</h1>
    <p style="margin:0 0 24px; color:#444;">
      Fill this out to start onboarding. We’ll generate and ship your gym’s QR labels based on your equipment list.
    </p>

    <!-- IMPORTANT: Replace YOUR_FORMSPREE_ID in Part 2 -->
    <form action="https://formspree.io/f/mpqqwbjw" method="POST" enctype="multipart/form-data" style="display:grid; gap:14px;">
      <div>
        <label>Gym Name</label><br />
        <input name="gym_name" required style="width:100%; padding:10px;" />
      </div>

      <div>
        <label>Gym Location / Address (optional)</label><br />
        <input name="gym_location" style="width:100%; padding:10px;" />
      </div>

      <div>
        <label>Primary Contact Name</label><br />
        <input name="contact_name" required style="width:100%; padding:10px;" />
      </div>

      <div>
        <label>Email</label><br />
        <input name="email" type="email" required style="width:100%; padding:10px;" />
      </div>

      <div>
        <label>Phone</label><br />
        <input name="phone" required style="width:100%; padding:10px;" />
      </div>

      <div>
        <label>Estimated Machine Count</label><br />
        <input name="machine_count" required style="width:100%; padding:10px;" />
      </div>

      <div>
        <label>Equipment List Link (Google Sheet link)</label><br />
        <input name="equipment_list_link" placeholder="https://docs.google.com/..." style="width:100%; padding:10px;" />
        <div style="font-size:13px; color:#555; margin-top:6px;">
          Tip: Set sharing to “Anyone with the link can view”.
        </div>
      </div>
<div>
  <label>Or Upload Equipment List (Excel, PDF, or Image)</label><br />
  <input
    type="file"
    name="equipment_file"
    accept=".xlsx,.xls,.pdf,.jpg,.jpeg,.png"
    style="width:100%; padding:6px;"
  />
</div>

      <div>
        <label>Term Commitment</label><br />
        <select name="term" required style="width:100%; padding:10px;">
          <option value="">Select one</option>
          <option value="month-to-month">Month-to-Month</option>
          <option value="3-months">3 Months</option>
          <option value="6-months">6 Months</option>
          <option value="12-months">12 Months</option>
        </select>
      </div>

      <div style="border:1px solid #ddd; padding:12px; border-radius:8px;">
        <label style="display:flex; gap:10px; align-items:flex-start;">
          <input type="checkbox" name="agreement_acceptance" required />
          <span>
            I have read and agree to the
            <a href="/agreement/scanliftlog-service-agreement.pdf" target="_blank" rel="noopener">
              ScanLiftLog Service Agreement
            </a>.
          </span>
        </label>
      </div>

      <button type="submit" style="padding:14px 18px; background:#000; color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer;">
        Submit Signup
      </button>

      <p style="font-size:13px; color:#666; margin:0;">
        After submission, we’ll review your equipment list and confirm your subscription tier based on machine count.
      </p>
    </form>
  </div>
</body>
</html>
